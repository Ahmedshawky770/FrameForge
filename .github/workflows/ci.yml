name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  DEBIAN_FRONTEND: noninteractive

jobs:
  # Quick check: lint, format, and unit tests (no system deps needed)
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies (headless crates only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config build-essential libssl-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace --lib

  # Build and smoke test: full build with C dependencies, run the app
  build-and-smoke:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies (full build)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libmpv-dev \
            libavcodec-dev libavformat-dev libswscale-dev libswresample-dev \
            libavfilter-dev libavutil-dev \
            libwebkit2gtk-4.0-dev libgtk-3-dev \
            libssl-dev pkg-config build-essential \
            clang libclang-dev nasm \
            xvfb

      - name: Build release
        run: cargo build --release --locked --bin frameforge-tauri-app --bin frameforge-cli

      - name: Run smoke test (headless X11)
        run: |
          # Start Xvfb for headless display testing
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          export DISPLAY=:99
          
          # Test CLI probe
          ./target/release/frameforge-cli probe tests/fixtures/all-intra.mp4
          
          # Test CLI build-index
          ./target/release/frameforge-cli build-index tests/fixtures/all-intra.mp4
          
          # Test CLI export (stream-copy)
          ./target/release/frameforge-cli export \
            --input tests/fixtures/all-intra.mp4 \
            --output /tmp/smoke-out.mp4 \
            --segments "0,5"
          
          # Verify output
          ffprobe -v error -show_format /tmp/smoke-out.mp4

  # .deb package build (Ubuntu 22.04)
  deb-package:
    needs: build-and-smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev debhelper build-essential fakeroot

      - name: Build Rust release binary
        run: |
          sudo apt-get install -y -qq \
            libmpv-dev libavcodec-dev libavformat-dev libswscale-dev \
            libswresample-dev libavfilter-dev libavutil-dev \
            libwebkit2gtk-4.0-dev libgtk-3-dev libssl-dev pkg-config \
            clang libclang-dev nasm
          cargo build --release --locked --bin frameforge-tauri-app

      - name: Build .deb package
        run: |
          cd packaging/debian
          dpkg-buildpackage -b -us -uc

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-deb
          path: ../*.deb
          retention-days: 7

  # AppImage build (evaluation)
  appimage:
    needs: build-and-smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install AppImageKit
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          echo "${PWD}" >> $GITHUB_PATH

      - name: Build Rust release binary
        run: |
          sudo apt-get install -y -qq \
            libmpv-dev libavcodec-dev libavformat-dev libswscale-dev \
            libswresample-dev libavfilter-dev libavutil-dev \
            libwebkit2gtk-4.0-dev libgtk-3-dev libssl-dev pkg-config \
            clang libclang-dev nasm
          cargo build --release --locked --bin frameforge-tauri-app

      - name: Build AppImage
        run: |
          cd packaging/appimage
          export ARCH=x86_64
          ./appimagetool packaging/appimage FrameForge-0.1.0-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-appimage
          path: packaging/FrameForge-0.1.0-x86_64.AppImage
          retention-days: 7
